<svg
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  role="img"
  width="32"
  height="32"
  viewBox="0 0 64 64"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="vyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="18"
    fill="#0A0A0A"
  />

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="62"
    height="62"
    rx="17"
    stroke="#1F1F1F"
    stroke-width="2"
  />

  <!-- Text -->
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    fill="url(#vyGradient)"
    font-size="24"
    font-family="Inter, Arial, sans-serif"
    font-weight="700"
    letter-spacing="1"
  >
    VY
  </text>
</svg>
